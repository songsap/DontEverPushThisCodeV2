name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow-level permissions: grant only what the scanners need.
permissions:
  contents: read
  actions: read
  id-token: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  # GATE#0: Secret scanning (TruffleHog + Gitleaks)
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history is needed to resolve the base/head commits reliably.
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true # Workshop setting: allow the remaining scanners to run.
        with:
          path: ./
          # For PRs scan base..head; for pushes scan the pushed commit range.
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # Workshop setting: allow the remaining scanners to run.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # GATE#1a: SAST via SonarCloud/SonarQube scanner
  sast-scan:
    runs-on: ubuntu-latest
    needs: secret-scanning
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Sonar uses blame information for new-code detection.
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        continue-on-error: true # Workshop setting: allow the remaining scanners to run.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # GATE#1b: SAST via CodeQL (results in GitHub Security tab)
  codeql-scan:
    runs-on: ubuntu-latest
    needs: secret-scanning
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # Next.js/React and its API routes are JavaScript/TypeScript.
        language: [javascript-typescript]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # GATE#2: Dependency scanning via OWASP Dependency-Check (SARIF + HTML)
  dependency-scanning:
    runs-on: ubuntu-latest
    needs: [sast-scan, secret-scanning]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Depcheck
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true # Workshop setting: allow report upload and later gates.
        id: Depcheck
        with:
          project: DontEverPushThisCodeV2
          path: .
          format: SARIF
          out: reports
          # CVSS 7.0 is the HIGH threshold; fail on HIGH and above.
          args: >-
            --failOnCVSS 7
            --enableRetired

      - name: Upload Depcheck SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check

      - name: Upload Depcheck report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depcheck-report
          path: reports/
          if-no-files-found: warn

  # GATE#3: Container/Image scanning via Trivy (SARIF + artifact)
  image-scanning:
    runs-on: ubuntu-latest
    needs: [dependency-scanning]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app:latest .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true # Workshop setting: allow report upload and later steps.
        with:
          image-ref: my-app:latest
          format: sarif
          output: trivy-results.sarif
          # Report HIGH and CRITICAL findings; LOW/MEDIUM do not gate this workshop build.
          severity: HIGH,CRITICAL
          # Include vulnerabilities even when no fixed version is available.
          ignore-unfixed: "false"

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Upload Trivy SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: warn

  # GATE#4: IaC scanning is out of scope for this workshop.
  # GATE#5: DAST is covered in the separate OWASP ZAP workshop.
